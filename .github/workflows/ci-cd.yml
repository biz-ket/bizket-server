name: 개발 서버용 CI/CD 파이프라인

on:
  pull_request:
    branches:
      - "release/*"

permissions:
  contents: read

jobs:
  CI-CD:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: JDK 21 설정
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 캐싱
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: application.yml 파일 생성 및 내용 주입
        run: |
          touch ./src/main/resources/application.yml
          echo "${{ secrets.APPLICATION }}" > ./src/main/resources/application.yml
          cat ./src/main/resources/application.yml

      - name: Gradle 빌드
        run: ./gradlew build -x test

      - name: Docker 이미지 빌드 및 푸시
        if: contains(github.event.pull_request.base.ref, 'release')
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          sudo docker build --platform linux/amd64/v3 -t "${{ secrets.DOCKER_USERNAME }}/bizket-server:latest" .
          sudo docker push "${{ secrets.DOCKER_USERNAME }}/bizket-server:latest"

      - name: 개발 서버에 배포
        if: contains(github.event.pull_request.base.ref, 'release')
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_DEV }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PRIVATE_KEY_PASSPHRASE }}
          script: |
            sudo docker ps -a
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/bizket-server:latest
            sudo docker run --name bizket-app -d -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/bizket-server:latest
            sudo docker image prune -f
