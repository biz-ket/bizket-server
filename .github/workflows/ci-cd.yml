name: CI-CD

on:
  push:
    branches:
      - "release/*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: JDK 21 설정
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 캐싱
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: application-secret.yml 및 application.yml 생성
        run: |
          mkdir -p src/main/resources

          cat <<EOF > src/main/resources/application-secret.yml
          # Google Custom Search 설정
          google:
            cse:
              key: ${{ secrets.GOOGLE_CSE_KEY }}
              cx:  ${{ secrets.GOOGLE_CSE_CX }}

          # JWT 설정
          jwt:
            secret: ${{ secrets.JWT_SECRET_KEY }}
            access-expiration-ms: ${{ secrets.JWT_ACCESS_EXPIRATION_TIME }}
            refresh-expiration-ms: ${{ secrets.JWT_REFRESH_EXPIRATION_TIME }}

          # HTTPS(Local) / SSL
          server:
            port: 8080
            ssl:
              enabled: true
              key-store: classpath:keystore.p12
              key-store-password: changeit
              key-store-type: PKCS12
              key-alias: springboot

          spring:
            config:
              import: classpath:application-secret.yml
              activate:
                on-profile: dev

            security:
              oauth2:
                client:
                  registration:
                    instagram:
                      client-id: ${{ secrets.INSTAGRAM_CLIENT_ID }}
                      client-secret: ${{ secrets.INSTAGRAM_CLIENT_SECRET }}
                      redirect-uri: ${{ secrets.OAUTH_REDIRECT_URI }}
                      prod-req-origin: https://bizket.vercel.app
                      prod-redirect-uri: https://bizket.vercel.app/login/callback
                      dev-redirect-uri: https://localhost:3000/login/callback

            datasource:
              url: jdbc:mysql://${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DEV_DB_NAME }}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
              username: ${{ secrets.DEV_DB_USERNAME }}
              password: ${{ secrets.DEV_DB_PASSWORD }}
              hikari:
                maximum-pool-size: 10
                minimum-idle: 10
                idle-timeout: 300000
                connection-timeout: 30000
                max-lifetime: 1500000

            jpa:
              hibernate:
                ddl-auto: update
          EOF

          # application.yml 은 그대로 secrets.APPLICATION_YML 에 담겨 있는 내용을 사용
          echo "${{ secrets.APPLICATION_YML }}" > src/main/resources/application.yml

      - name: 테스트 및 REST Docs 생성
        run: ./gradlew clean test asciidoctor

      - name: Gradle 빌드
        run: ./gradlew build -x test

      - name: Docker 빌드 및 푸시
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build --platform linux/amd64 -t "${{ secrets.DOCKER_USERNAME }}/bizket-server:latest" .
          docker push "${{ secrets.DOCKER_USERNAME }}/bizket-server:latest"

          docker build --platform linux/amd64 \
            -f pytrends_service/Dockerfile \
            -t "${{ secrets.DOCKER_USERNAME }}/bizket-trends-py:latest" \
            .
          docker push "${{ secrets.DOCKER_USERNAME }}/bizket-trends-py:latest"

      - name: 서버 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_DEV }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PRIVATE_KEY_PASSPHRASE }}
          script: |
            cd /root
            # .env.clean 에는 KEY=VALUE 형태의 라인만 남김
            grep -E '^[A-Za-z0-9_]+=.*' .env > .env.clean

            # Bizket Java 앱 재배포
            sudo docker stop bizket-app || true
            sudo docker rm   bizket-app || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/bizket-server:latest
            sudo docker run --name bizket-app -d \
              -p 8080:8080 \
              --network root-network \
              --env-file .env.clean \
              ${{ secrets.DOCKER_USERNAME }}/bizket-server:latest \
              -c "/wait-for-it.sh bizket-db:3306 -- \
                java \
                  -Djwt.secret=\"$JWT_SECRET_KEY\" \
                  -Djwt.access-expiration-ms=\"$JWT_ACCESS_EXPIRATION_TIME\" \
                  -Djwt.refresh-expiration-ms=\"$JWT_REFRESH_EXPIRATION_TIME\" \
                  -jar app.jar"

            # PyTrends Python 서비스 재배포
            sudo docker stop pytrends-app || true
            sudo docker rm   pytrends-app || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/bizket-trends-py:latest
            sudo docker run --name pytrends-app -d \
              -p 5000:5000 \
              --network root-network \
              --env-file .env.clean \
              ${{ secrets.DOCKER_USERNAME }}/bizket-trends-py:latest

            sudo docker image prune -f
