name: CD

on:
  push:
    branches:
      - "release/*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: JDK 21 설정
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 캐싱
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: application.yml 생성
        run: |
          echo "${{ secrets.APPLICATION }}" > ./src/main/resources/application.yml

      - name: Gradle 빌드
        run: ./gradlew build -x test

      - name: Docker 빌드 및 푸시
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build --platform linux/amd64 -t "${{ secrets.DOCKER_USERNAME }}/bizket-server:latest" .
          docker push "${{ secrets.DOCKER_USERNAME }}/bizket-server:latest"

      - name: 서버 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_DEV }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PRIVATE_KEY_PASSPHRASE }}
          script: |
            cd /root
            
            sudo docker stop bizket-app || true
            sudo docker rm bizket-app || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/bizket-server:latest
            sudo docker run --name bizket-app -d \
              -p 8080:8080 \
              --network root-network \
              --env-file .env \
              ${{ secrets.DOCKER_USERNAME }}/bizket-server:latest
            sudo docker image prune -f
