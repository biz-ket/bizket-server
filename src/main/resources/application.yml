spring:
  profiles:
    active: dev
  application:
    name: bizket

  config:
    import: "classpath:application-secret.yml"
  security:
    oauth2:
      client:
        registration:
          instagram:
            scope:
              - user_profile
              - user_media
            provider: instagram
            client-name: Instagram
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
        provider:
          instagram:
            user-name-attribute: id
            authorization-uri: https://api.instagram.com/oauth/authorize
            token-uri: https://api.instagram.com/oauth/access_token
            user-info-uri: https://graph.instagram.com/me
py:
  trends-service-url: http://localhost:5000

server:
  port: 8080

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false

logging:
  level:
    org.springframework.web.client.RestTemplate: DEBUG
    org.apache.http: DEBUG
